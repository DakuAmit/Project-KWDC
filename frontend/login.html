<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - KTM-WDC Logistics Portal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #f97316; --primary-hover: #ea580c; }
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3, .kwdc-serif { font-family: 'Newsreader', Georgia, serif; }
        body { background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.85);
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
        }
        .btn-kwdc {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            font-weight: 600;
            border-radius: 10px;
            padding: 10px;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-kwdc:hover { color: white; transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="glass-card">
    <div class="text-center mb-4">
        <div style="width: 48px; height: 48px; background:#f97316; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; color:white; font-size:22px; margin-bottom:12px; box-shadow:0 4px 14px rgba(249,115,22,0.35);">
            <i class="fa-solid fa-cube"></i>
        </div>
        <h3 class="fw-bold kwdc-serif text-dark mb-1">KTM-WDC Sign In</h3>
        <p class="text-muted fs-7">Access your Nepal Commercial Logistics Portal</p>
    </div>

    <!-- 1-Click Demo Fill Selector -->
    <div class="mb-3">
        <label class="form-label text-muted fs-8 text-uppercase fw-bold">1-Click Demo Fill:</label>
        <div class="d-flex flex-wrap gap-1.5">
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="fill('admin.access@kwdc.test')">Admin</button>
            <button type="button" class="btn btn-sm btn-outline-primary" onclick="fill('client.access@kwdc.test')">Client</button>
            <button type="button" class="btn btn-sm btn-outline-warning" onclick="fill('driver.access@kwdc.test')">Driver</button>
            <button type="button" class="btn btn-sm btn-outline-success" onclick="fill('property.access@kwdc.test')">Property</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fill('security.access@kwdc.test')">Security</button>
            <button type="button" class="btn btn-sm btn-outline-dark" onclick="fill('equipment.access@kwdc.test')">Equipment</button>
        </div>
    </div>

    <div id="error-alert" class="alert alert-danger py-2 fs-7 d-none" role="alert"></div>

    <form id="login-form">
        <div class="mb-3">
            <label class="form-label fs-7 fw-bold">Email Address</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="fa-solid fa-envelope text-muted"></i></span>
                <input type="text" id="email" class="form-control" placeholder="user@kwdc.test" value="client.access@kwdc.test" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fs-7 fw-bold">Master Password</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="fa-solid fa-key text-muted"></i></span>
                <input type="password" id="password" class="form-control" value="KwdcNew2026!" required>
            </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-kwdc w-100 py-2.5 fs-6 mt-2">
            <i class="fa-solid fa-right-to-bracket me-2"></i> Authenticate & Enter
        </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top fs-7 text-muted">
        Need an enterprise account? <a href="/register.html" class="text-warning fw-bold text-decoration-none">Register here</a>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
function fill(email) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = 'KwdcNew2026!';
}

document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errBox = document.getElementById('error-alert');
    errBox.classList.add('d-none');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i> Verifying...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
        const data = await KWDC_API.login(email, password);
        if (data && data.access_token) {
            window.location.href = '/dashboard.html';
        } else {
            errBox.innerText = 'Invalid credentials or inactive account.';
            errBox.classList.remove('d-none');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i> Authenticate & Enter';
        }
    } catch(err) {
        errBox.innerText = 'Unable to connect to KTM-WDC API server.';
        errBox.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i> Authenticate & Enter';
    }
});
</script>
</body>
</html>
