<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - KTM-WDC Logistics Portal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #f97316; --primary-hover: #ea580c; }
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3, .kwdc-serif { font-family: 'Newsreader', Georgia, serif; }
        body { background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 45px -15px rgba(15, 23, 42, 0.08);
            width: 100%;
            max-width: 460px;
        }
        .btn-kwdc {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-kwdc:hover { color: white; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3); }
        .form-control { border-radius: 10px; padding: 11px 14px; font-size: 14.5px; border-color: #cbd5e1; }
        .form-control:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15); }
        .input-group-text { border-radius: 10px 0 0 10px; border-color: #cbd5e1; }
    </style>
</head>
<body>

<div class="glass-card">
    <div class="text-center mb-4">
        <a href="/" style="text-decoration:none; display:inline-block;">
            <div style="width: 52px; height: 52px; background:#f97316; border-radius:14px; display:inline-flex; align-items:center; justify-content:center; color:white; font-size:24px; margin-bottom:12px; box-shadow:0 6px 16px rgba(249,115,22,0.35);">
                <i class="fa-solid fa-cube"></i>
            </div>
        </a>
        <h3 class="fw-bold kwdc-serif text-dark mb-1">Sign In to KTM-WDC</h3>
        <p class="text-muted fs-7">Access your Commercial Logistics & Warehousing Portal</p>
    </div>

    <!-- Feedback Alerts -->
    <div id="status-alert" class="alert alert-success py-2.5 fs-7 d-none" role="alert"></div>
    <div id="error-alert" class="alert alert-danger py-2.5 fs-7 d-none" role="alert"></div>

    <form id="login-form">
        <div class="mb-3">
            <label class="form-label fs-7 fw-bold text-dark">Email Address</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                <input type="email" id="email" class="form-control" placeholder="name@company.com" required autocomplete="email">
            </div>
        </div>

        <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label fs-7 fw-bold text-dark mb-0">Password</label>
                <a href="/forgot-password.html" class="fs-8 text-decoration-none" style="color: #ea580c; font-weight: 600;">Forgot Password?</a>
            </div>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                <button class="btn btn-outline-secondary" type="button" id="toggle-pwd" style="border-radius: 0 10px 10px 0; border-color: #cbd5e1;">
                    <i class="fa-regular fa-eye" id="pwd-icon"></i>
                </button>
            </div>
        </div>

        <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label fs-7 text-muted" for="remember">
                Keep me signed in
            </label>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-kwdc w-100 py-2.5 fs-6">
            <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
        </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top fs-7 text-muted">
        Don't have an account? <a href="/register.html" class="fw-bold text-decoration-none" style="color: #ea580c;">Register here</a>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
// Check URL query parameters for feedback messages
const urlParams = new URLSearchParams(window.location.search);
const statusBox = document.getElementById('status-alert');
if (urlParams.get('verified') === 'true') {
    statusBox.innerText = '✅ Email verified successfully! You can now sign in.';
    statusBox.classList.remove('d-none');
} else if (urlParams.get('reset') === 'true') {
    statusBox.innerText = '✅ Password reset successfully! Please sign in with your new password.';
    statusBox.classList.remove('d-none');
} else if (urlParams.get('registered') === 'true') {
    statusBox.innerText = '✅ Account created! A verification email has been sent to your inbox.';
    statusBox.classList.remove('d-none');
}

// Password toggle
document.getElementById('toggle-pwd').addEventListener('click', function() {
    const pwdInput = document.getElementById('password');
    const icon = document.getElementById('pwd-icon');
    if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        pwdInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
});

// Handle Login Form Submit
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errBox = document.getElementById('error-alert');
    errBox.classList.add('d-none');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i> Authenticating...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
        const data = await KWDC_API.login(email, password);
        if (data && data.access_token) {
            const userRole = (data.user && (data.user.is_admin || data.user.role === 'admin')) ? 'admin' : ((data.user && data.user.role) || 'client');
            window.location.href = KWDC_API.getDashboardUrl(userRole);
        } else {
            errBox.innerText = 'Invalid email address or password. Please try again.';
            errBox.classList.remove('d-none');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i> Sign In';
        }
    } catch(err) {
        errBox.innerText = (err && err.message) ? err.message : 'Unable to connect to KTM-WDC server. Please check your network.';
        errBox.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i> Sign In';
    }
});
</script>
</body>
</html>
