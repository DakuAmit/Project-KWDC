<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Fleet Tracking - KTM-WDC Telemetry</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --primary: #f97316; }
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3, .kwdc-serif { font-family: 'Newsreader', Georgia, serif; }
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.85); border-radius: 16px; padding: 24px; margin-bottom: 24px;
        }
        .btn-kwdc {
            background: linear-gradient(135deg, #f97316, #ea580c); color: white;
            font-weight: 600; border-radius: 10px; padding: 8px 18px; border: none;
        }
        .btn-kwdc:hover { color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4" href="/">
            <div style="width: 32px; height: 32px; background:#f97316; border-radius:8px; display:flex; align-items:center; justify-content:center; color:white;">
                <i class="fa-solid fa-cube"></i>
            </div>
            <span>KTM-WDC</span>
        </a>
        <div class="ms-auto d-flex gap-2">
            <a href="/dashboard.html" class="btn btn-outline-dark btn-sm rounded-3">Dashboard</a>
            <a href="/dispatch.html" class="btn btn-outline-warning btn-sm rounded-3">New Dispatch</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="glass-card p-0 overflow-hidden shadow">
                <div id="map" style="height: 520px; width: 100%;"></div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="glass-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="badge bg-warning-subtle text-warning fs-8">
                        <i class="fa-solid fa-satellite-dish me-1"></i> ASGI Telemetry Stream
                    </span>
                    <span class="badge bg-success-subtle text-success fs-8">Live (100ms)</span>
                </div>

                <div class="mb-3">
                    <div class="text-muted fs-8 text-uppercase fw-bold">Active Tracking ID</div>
                    <div class="fs-5 fw-bold text-dark"><code>TRK-KWDC-9812</code></div>
                </div>

                <div class="mb-3">
                    <div class="text-muted fs-8 text-uppercase fw-bold">Assigned Commercial Driver</div>
                    <div class="fw-bold fs-6">Madan Gurung (BA 1 KA 1234)</div>
                    <div class="text-muted fs-8">Tata Ace 1.5-Ton | Rating: 4.9 ★</div>
                </div>

                <div class="p-3 rounded-3 bg-light mb-3 fs-7">
                    <div class="d-flex justify-content-between mb-1">
                        <span class="text-muted">Route Distance:</span>
                        <span class="fw-bold">18.5 km</span>
                    </div>
                    <div class="d-flex justify-content-between mb-1">
                        <span class="text-muted">Estimated Arrival:</span>
                        <span class="fw-bold text-primary">~18 mins</span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="text-muted">Current Speed:</span>
                        <span class="fw-bold text-success">38 km/h</span>
                    </div>
                </div>

                <a href="/invoices.html" class="btn btn-kwdc w-100">
                    <i class="fa-solid fa-file-invoice me-1"></i> View Tax Invoice
                </a>
            </div>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const map = L.map('map').setView([27.6823, 85.3038], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Origin Depot
    L.marker([27.6823, 85.3038]).addTo(map)
        .bindPopup("<b>Pickup:</b> Kalimati Cold Store, Kathmandu")
        .openPopup();

    // Destination
    L.marker([27.6753, 85.3230]).addTo(map)
        .bindPopup("<b>Destination:</b> Balkumari Wholesale Depot");

    // Moving Driver Marker
    const driverIcon = L.divIcon({
        className: 'driver-live-marker',
        html: '<div style="background:#f97316;color:white;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px rgba(249,115,22,0.8);"><i class="fa-solid fa-truck"></i></div>',
        iconSize: [34, 34],
        iconAnchor: [17, 17]
    });
    const driverMarker = L.marker([27.6810, 85.3100], {icon: driverIcon}).addTo(map);

    // Simulated driver movement along route
    let step = 0;
    const path = [
        [27.6823, 85.3038],
        [27.6800, 85.3100],
        [27.6780, 85.3150],
        [27.6765, 85.3200],
        [27.6753, 85.3230]
    ];
    setInterval(() => {
        step = (step + 1) % path.length;
        driverMarker.setLatLng(path[step]);
    }, 3000);
});
</script>
</body>
</html>
