<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - KTM-WDC Logistics</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #f97316; }
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3, .kwdc-serif { font-family: 'Newsreader', Georgia, serif; }
        body { background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
        .glass-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 20px 45px -15px rgba(15, 23, 42, 0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        .otp-input {
            letter-spacing: 10px;
            font-size: 32px;
            font-weight: 800;
            text-align: center;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            background: #fffaf5;
            color: #c2410c;
            height: 64px;
        }
        .otp-input:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15);
            background: white;
        }
        .btn-kwdc {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px 28px;
            border: none;
            display: inline-block;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-kwdc:hover { color: white; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3); }
    </style>
</head>
<body>

<div class="glass-card">
    <div style="width: 58px; height: 58px; background: linear-gradient(135deg, #f97316, #ea580c); border-radius:16px; display:inline-flex; align-items:center; justify-content:center; color:white; font-size:24px; margin-bottom:16px; box-shadow: 0 8px 20px rgba(249, 115, 22, 0.25);">
        <i class="fa-solid fa-envelope-open-text"></i>
    </div>
    
    <h3 class="fw-bold kwdc-serif text-dark mb-1">Verify Your Email</h3>
    <p class="text-muted fs-7 mb-3">
        Enter the 6-digit verification code sent to your email to activate your KTM-WDC commercial logistics account.
    </p>

    <!-- Alerts -->
    <div id="alert-error" class="alert alert-danger fs-7 py-2.5 px-3 rounded-3 text-start d-none mb-3"></div>
    <div id="alert-info" class="alert alert-info fs-7 py-2.5 px-3 rounded-3 text-start d-none mb-3"></div>
    <div id="alert-success" class="alert alert-success fs-7 py-2.5 px-3 rounded-3 text-start d-none mb-3"></div>

    <form id="verify-form" class="text-start mb-3">
        <div class="mb-3">
            <label class="form-label fs-8 text-uppercase fw-bold text-muted">Registered Email Address</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                <input type="email" id="email" class="form-control border-start-0 fs-7" placeholder="you@domain.com" required>
            </div>
        </div>

        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label fs-8 text-uppercase fw-bold text-muted mb-0">6-Digit Verification Code</label>
                <span class="text-muted fs-8">Check inbox / spam</span>
            </div>
            <input type="text" id="otp-code" class="form-control otp-input" placeholder="000000" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" required autofocus>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-kwdc w-100">
            <i class="fa-solid fa-circle-check me-2"></i> Verify Code & Enter Cockpit
        </button>
    </form>

    <div class="d-flex justify-content-between align-items-center pt-2 border-top">
        <button type="button" class="btn btn-link text-decoration-none fs-8 text-muted p-0" id="resend-btn" onclick="resendCode()">
            <i class="fa-solid fa-rotate-right me-1"></i> Resend Verification Code
        </button>
        <a href="/login.html" class="text-decoration-none fs-8 text-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
        </a>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const emailParam = urlParams.get('email') || '';
const codeParam = urlParams.get('code') || urlParams.get('token') || '';
const isNew = urlParams.get('new') === 'true';

const emailInput = document.getElementById('email');
const otpInput = document.getElementById('otp-code');
const errBox = document.getElementById('alert-error');
const infoBox = document.getElementById('alert-info');
const succBox = document.getElementById('alert-success');
const submitBtn = document.getElementById('submit-btn');
const resendBtn = document.getElementById('resend-btn');

if (emailParam) {
    emailInput.value = emailParam;
}

if (isNew) {
    infoBox.innerText = `A 6-digit verification code was dispatched to ${emailParam}. Please enter it below.`;
    infoBox.classList.remove('d-none');
}

// Auto-verify if code is present in URL (e.g. from 1-click email link)
if (codeParam && emailParam) {
    otpInput.value = codeParam;
    doVerify(emailParam, codeParam);
}

// Handle Verification Form Submission
document.getElementById('verify-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = emailInput.value.trim();
    const code = otpInput.value.trim();

    if (!email || !code) {
        showError('Please provide both your registered email and 6-digit verification code.');
        return;
    }

    await doVerify(email, code);
});

async function doVerify(email, code) {
    hideAlerts();
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i> Verifying Code...';

    try {
        const result = await KWDC_API.verifyCode(email, code);
        if (result.ok && result.data) {
            succBox.innerText = 'Email verified successfully! Redirecting to your operational cockpit...';
            succBox.classList.remove('d-none');
            submitBtn.innerHTML = '<i class="fa-solid fa-check me-2"></i> Verified!';
            
            const role = (result.data.user && result.data.user.role) ? result.data.user.role : (result.data.role || 'client');
            setTimeout(() => {
                window.location.href = KWDC_API.getDashboardUrl(role);
            }, 1200);
        } else {
            showError(result.data?.detail || 'Invalid or expired verification code. Please check your inbox or click Resend.');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-check me-2"></i> Verify Code & Enter Cockpit';
        }
    } catch (err) {
        showError(err.message || 'Unable to connect to verification server. Please try again.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-circle-check me-2"></i> Verify Code & Enter Cockpit';
    }
}

async function resendCode() {
    const email = emailInput.value.trim();
    if (!email) {
        showError('Please enter your email address to resend code.');
        return;
    }

    hideAlerts();
    resendBtn.disabled = true;
    resendBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-1"></i> Resending...';

    try {
        const result = await KWDC_API.resendCode(email);
        if (result.ok) {
            infoBox.innerText = result.data.message || `A new 6-digit code has been sent to ${email}.`;
            infoBox.classList.remove('d-none');
            
            // If running in development simulation or domain blocked, show code preview
            if (result.data.verification_code_preview) {
                infoBox.innerHTML += `<div class="mt-2 fw-bold text-dark p-2 bg-light rounded-2 border">Dev Preview Code: <span class="text-primary">${result.data.verification_code_preview}</span></div>`;
            }
        } else {
            showError(result.data?.detail || 'Failed to resend code. Please try again.');
        }
    } catch (err) {
        showError(err.message || 'Error communicating with server.');
    } finally {
        resendBtn.disabled = false;
        resendBtn.innerHTML = '<i class="fa-solid fa-rotate-right me-1"></i> Resend Verification Code';
    }
}

function showError(msg) {
    errBox.innerText = msg;
    errBox.classList.remove('d-none');
}

function hideAlerts() {
    errBox.classList.add('d-none');
    infoBox.classList.add('d-none');
    succBox.classList.add('d-none');
}
</script>
</body>
</html>
