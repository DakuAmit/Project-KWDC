<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - KTM-WDC Logistics</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #f97316; }
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3, .kwdc-serif { font-family: 'Newsreader', Georgia, serif; }
        body { background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 45px -15px rgba(15, 23, 42, 0.08);
            width: 100%;
            max-width: 460px;
        }
        .btn-kwdc {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-kwdc:hover { color: white; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3); }
        .form-control { border-radius: 10px; padding: 11px 14px; font-size: 14.5px; border-color: #cbd5e1; }
        .form-control:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15); }
        .input-group-text { border-radius: 10px 0 0 10px; border-color: #cbd5e1; }
    </style>
</head>
<body>

<div class="glass-card">
    <div class="text-center mb-4">
        <div style="width: 52px; height: 52px; background:#10b981; border-radius:14px; display:inline-flex; align-items:center; justify-content:center; color:white; font-size:24px; margin-bottom:12px; box-shadow:0 6px 16px rgba(16,185,129,0.3);">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h3 class="fw-bold kwdc-serif text-dark mb-1">Set New Password</h3>
        <p class="text-muted fs-7">Choose a secure, strong password for your KTM-WDC account.</p>
    </div>

    <div id="error-alert" class="alert alert-danger py-2.5 fs-7 d-none" role="alert"></div>
    <div id="success-alert" class="alert alert-success py-2.5 fs-7 d-none" role="alert"></div>

    <form id="reset-form">
        <div class="mb-3">
            <label class="form-label fs-7 fw-bold text-dark">New Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" id="new-password" class="form-control" placeholder="Minimum 8 characters" minlength="8" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fs-7 fw-bold text-dark">Confirm New Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-check text-muted"></i></span>
                <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter password" minlength="8" required>
            </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-kwdc w-100 py-2.5 fs-6">
            <i class="fa-solid fa-floppy-disk me-2"></i> Update Password
        </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top fs-7 text-muted">
        Remembered password? <a href="/login.html" class="fw-bold text-decoration-none" style="color: #ea580c;">Back to Sign In</a>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');
const errBox = document.getElementById('error-alert');
const submitBtn = document.getElementById('submit-btn');

if (!token) {
    errBox.innerHTML = '<strong>Missing Token!</strong><br>This password reset link is invalid or incomplete. Please request a new link.';
    errBox.classList.remove('d-none');
    submitBtn.disabled = true;
}

document.getElementById('reset-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    errBox.classList.add('d-none');

    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    if (newPassword !== confirmPassword) {
        errBox.innerText = 'Passwords do not match. Please ensure both fields are identical.';
        errBox.classList.remove('d-none');
        return;
    }

    if (newPassword.length < 8) {
        errBox.innerText = 'Password must be at least 8 characters long.';
        errBox.classList.remove('d-none');
        return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i> Updating...';

    try {
        const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                token: token,
                new_password: newPassword
            })
        });
        const data = await res.json();
        if (res.ok) {
            window.location.href = '/login.html?reset=true';
        } else {
            errBox.innerText = data.detail || 'Failed to reset password. Link may have expired.';
            errBox.classList.remove('d-none');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk me-2"></i> Update Password';
        }
    } catch(err) {
        errBox.innerText = 'Network error contacting KTM-WDC server. Please try again.';
        errBox.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk me-2"></i> Update Password';
    }
});
</script>
</body>
</html>
