<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cockpit - KTM-WDC Commercial Logistics</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/kwdc-ui.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #f97316;
            --sidebar-bg: #0f172a;
            --card-glass: rgba(255, 255, 255, 0.92);
        }
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3, .kwdc-serif { font-family: 'Newsreader', Georgia, serif; }
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; }
        
        .sidebar {
            width: 260px; background: var(--sidebar-bg); color: #cbd5e1;
            position: fixed; top: 0; bottom: 0; left: 0; z-index: 100;
            overflow-y: auto; border-right: 1px solid #1e293b;
        }
        .sidebar-brand {
            padding: 20px; display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .sidebar-section-label {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
            color: #64748b; font-weight: 700; padding: 12px 18px 4px;
        }
        .sidebar-link {
            display: flex; align-items: center; gap: 10px; padding: 10px 18px; margin: 3px 12px;
            color: #94a3b8; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 13.5px;
            transition: all 0.2s ease;
        }
        .sidebar-link:hover, .sidebar-link.active {
            color: white; background: rgba(249, 115, 22, 0.18);
        }
        .main-wrapper { margin-left: 260px; padding: 24px 32px; }
        .topbar {
            background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.8); border-radius: 14px;
            padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;
        }
        .glass-card {
            background: var(--card-glass); backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.85); border-radius: 16px; padding: 24px; margin-bottom: 24px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.03);
        }
        .btn-kwdc {
            background: linear-gradient(135deg, #f97316, #ea580c); color: white;
            font-weight: 600; border-radius: 10px; padding: 8px 18px; border: none;
        }
        .btn-kwdc:hover { color: white; opacity: 0.95; }
        .role-badge-admin { background: #fee2e2; color: #991b1b; }
        .role-badge-property { background: #dcfce7; color: #166534; }
        .role-badge-driver { background: #e0f2fe; color: #075985; }
        .role-badge-client { background: #ffedd5; color: #9a3412; }
        .role-badge-equipment { background: #fef3c7; color: #92400e; }
        .role-badge-security { background: #ede9fe; color: #5b21b6; }
    </style>
</head>
<body>

<!-- Dynamic Sidebar Navigation -->
<aside class="sidebar">
    <div class="sidebar-brand">
        <div style="width:34px; height:34px; background:#f97316; border-radius:8px; display:flex; align-items:center; justify-content:center; color:white;">
            <i class="fa-solid fa-cube"></i>
        </div>
        <div>
            <div class="fw-bold text-white fs-6">KTM-WDC</div>
            <div class="text-muted" style="font-size:11px;" id="sidebar-role-subtitle">Commercial Portal</div>
        </div>
    </div>

    <!-- Admin Entity Preview Selector (Visible only to Admin) -->
    <div id="admin-view-switcher" class="p-3 border-bottom border-secondary d-none">
        <label class="text-muted fs-8 text-uppercase fw-bold mb-1"><i class="fa-solid fa-eye me-1"></i> View Entity As</label>
        <select class="form-select form-select-sm bg-dark text-light border-secondary" id="entity-selector" onchange="switchEntityView(this.value)">
            <option value="admin">Platform Super Admin</option>
            <option value="property_owner">Warehouse Property Owner</option>
            <option value="driver">Commercial Driver</option>
            <option value="client">Enterprise Shipper</option>
            <option value="equipment_owner">Heavy Equipment Owner</option>
            <option value="security_agency">Licensed Security Agency</option>
        </select>
    </div>

    <div class="p-2" id="sidebar-nav-container">
        <!-- Dynamic Links Injected by JavaScript -->
    </div>

    <div style="padding: 20px;">
        <button class="btn btn-outline-danger w-100 btn-sm rounded-3" onclick="KWDC_API.logout()">
            <i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Sign Out
        </button>
    </div>
</aside>

<!-- Main Operations Cockpit -->
<div class="main-wrapper">
    <!-- Topbar Header -->
    <header class="topbar">
        <div class="d-flex align-items-center gap-3">
            <h4 class="mb-0 fw-bold" id="cockpit-title">Operations Cockpit</h4>
            <span class="badge px-3 py-1.5 rounded-pill fs-8 fw-bold text-uppercase" id="user-role-badge">Client</span>
            <span class="badge bg-light text-secondary border px-2.5 py-1 rounded-pill fs-8 d-none d-md-inline" id="user-code-badge">ID: ---</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <div class="text-end">
                <div class="fw-bold fs-7 text-dark" id="user-name">Loading user...</div>
                <div class="text-muted fs-8" id="user-email">...</div>
            </div>
            <div style="width:38px; height:38px; background:#f97316; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold;" id="user-avatar">
                U
            </div>
        </div>
    </header>

    <!-- Role-Specific Dynamic Cockpit Container -->
    <div id="role-cockpit-container">
        <div class="glass-card text-center py-5">
            <div class="spinner-border text-warning" role="status"></div>
            <div class="mt-3 text-muted fs-7">Loading your operational cockpit...</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/api.js"></script>
<script>
let currentUser = null;
let activeRole = 'client';
let liveStats = null;

document.addEventListener("DOMContentLoaded", async function () {
    currentUser = KWDC_API.getUser();
    if (!currentUser) {
        window.location.href = '/login.html';
        return;
    }

    // Determine initial role
    const urlParams = new URLSearchParams(window.location.search);
    const requestedRole = urlParams.get('role');
    const isSuperAdmin = (currentUser.is_admin || currentUser.role === 'admin');

    if (isSuperAdmin) {
        document.getElementById('admin-view-switcher').classList.remove('d-none');
        activeRole = requestedRole || 'admin';
        document.getElementById('entity-selector').value = activeRole;
    } else {
        activeRole = currentUser.role || 'client';
    }

    // Populate Topbar Profile
    document.getElementById('user-name').innerText = currentUser.name;
    document.getElementById('user-email').innerText = currentUser.email;
    document.getElementById('user-avatar').innerText = currentUser.name ? currentUser.name[0].toUpperCase() : 'U';
    if (currentUser.user_code) {
        const codeBadge = document.getElementById('user-code-badge');
        codeBadge.innerText = currentUser.user_code;
        codeBadge.classList.remove('d-none');
    }

    // Update Role Badge Styling
    updateRoleBadge(activeRole);

    // Render Role-Tailored Navigation
    renderSidebarNav(activeRole);

    // Fetch live backend metrics and render role cockpit
    try {
        liveStats = await KWDC_API.getDashboardStats();
    } catch (e) {
        console.warn("Could not fetch real-time stats, loading standard cockpit view.", e);
    }

    renderRoleCockpit(activeRole, liveStats);
});

function switchEntityView(role) {
    activeRole = role;
    updateRoleBadge(role);
    renderSidebarNav(role);
    renderRoleCockpit(role, liveStats);
    const url = new URL(window.location);
    url.searchParams.set('role', role);
    window.history.replaceState({}, '', url);
}

function updateRoleBadge(role) {
    const badge = document.getElementById('user-role-badge');
    badge.className = 'badge px-3 py-1.5 rounded-pill fs-8 fw-bold text-uppercase';
    
    const roleLabels = {
        'admin': 'Platform Super Admin',
        'property_owner': 'Warehouse Property Owner',
        'driver': 'Commercial Driver',
        'equipment_owner': 'Heavy Equipment Owner',
        'security_agency': 'Licensed Security Agency',
        'client': 'Enterprise Shipper'
    };

    const roleClasses = {
        'admin': 'role-badge-admin',
        'property_owner': 'role-badge-property',
        'driver': 'role-badge-driver',
        'equipment_owner': 'role-badge-equipment',
        'security_agency': 'role-badge-security',
        'client': 'role-badge-client'
    };

    badge.innerText = roleLabels[role] || role.replace('_', ' ');
    badge.classList.add(roleClasses[role] || 'role-badge-client');
    document.getElementById('sidebar-role-subtitle').innerText = roleLabels[role] || 'Portal';
}

function renderSidebarNav(role) {
    const container = document.getElementById('sidebar-nav-container');
    let html = '';

    if (role === 'admin') {
        html = `
            <div class="sidebar-section-label">Command & Strategy</div>
            <a href="javascript:void(0)" class="sidebar-link active" id="admin-nav-overview" onclick="switchAdminDrawer('overview')">
                <i class="fa-solid fa-gauge-high"></i> Overview & Health
            </a>
            <a href="javascript:void(0)" class="sidebar-link" id="admin-nav-users" onclick="switchAdminDrawer('users')">
                <i class="fa-solid fa-users-gear"></i> Users & KYC
            </a>
            <a href="javascript:void(0)" class="sidebar-link" id="admin-nav-warehouses" onclick="switchAdminDrawer('warehouses')">
                <i class="fa-solid fa-warehouse"></i> Warehousing Registry
            </a>

            <div class="sidebar-section-label">Logistics Fleet</div>
            <a href="javascript:void(0)" class="sidebar-link" id="admin-nav-dispatches" onclick="switchAdminDrawer('dispatches')">
                <i class="fa-solid fa-truck-fast"></i> Freight Dispatches
            </a>
            <a href="javascript:void(0)" class="sidebar-link" id="admin-nav-telemetry" onclick="switchAdminDrawer('telemetry')">
                <i class="fa-solid fa-satellite-dish"></i> Live Telemetry Map
            </a>
            <a href="javascript:void(0)" class="sidebar-link" id="admin-nav-inventory" onclick="switchAdminDrawer('inventory')">
                <i class="fa-solid fa-boxes-stacked"></i> QR Inventory & Stock
            </a>
            <a href="javascript:void(0)" class="sidebar-link" id="admin-nav-equipment" onclick="switchAdminDrawer('equipment')">
                <i class="fa-solid fa-tractor"></i> Equipment & Machinery
            </a>
            <a href="javascript:void(0)" class="sidebar-link" id="admin-nav-security" onclick="switchAdminDrawer('security')">
                <i class="fa-solid fa-shield-halved"></i> Security & Incidents
            </a>

            <div class="sidebar-section-label">Finance & Governance</div>
            <a href="javascript:void(0)" class="sidebar-link" id="admin-nav-invoices" onclick="switchAdminDrawer('invoices')">
                <i class="fa-solid fa-file-invoice-dollar"></i> 13% IRD VAT Invoices
            </a>
            <a href="javascript:void(0)" class="sidebar-link" id="admin-nav-settings" onclick="switchAdminDrawer('settings')">
                <i class="fa-solid fa-sliders"></i> Platform Margins
            </a>
        `;
    } else if (role === 'property_owner') {
        html = `
            <div class="sidebar-section-label">Property Assets</div>
            <a href="/dashboard.html?role=property_owner" class="sidebar-link active"><i class="fa-solid fa-warehouse"></i> Facilities Cockpit</a>
            <a href="/warehouses.html" class="sidebar-link"><i class="fa-solid fa-boxes-stacked"></i> Commercial Storage</a>
            <a href="/invoices.html" class="sidebar-link"><i class="fa-solid fa-receipt"></i> Rental Cashflow</a>
            <a href="/tracking.html" class="sidebar-link"><i class="fa-solid fa-location-dot"></i> Hub Proximity</a>
        `;
    } else if (role === 'driver') {
        html = `
            <div class="sidebar-section-label">Driver Telemetry</div>
            <a href="/dashboard.html?role=driver" class="sidebar-link active"><i class="fa-solid fa-truck"></i> Driver Cockpit</a>
            <a href="/dispatch.html" class="sidebar-link"><i class="fa-solid fa-route"></i> Assigned Trips</a>
            <a href="/tracking.html" class="sidebar-link"><i class="fa-solid fa-satellite-dish"></i> Live Telemetry Hub</a>
            <a href="/invoices.html" class="sidebar-link"><i class="fa-solid fa-wallet"></i> Driver Fares</a>
        `;
    } else if (role === 'equipment_owner') {
        html = `
            <div class="sidebar-section-label">Heavy Machinery</div>
            <a href="/dashboard.html?role=equipment_owner" class="sidebar-link active"><i class="fa-solid fa-tractor"></i> Machinery Fleet</a>
            <a href="/invoices.html" class="sidebar-link"><i class="fa-solid fa-file-invoice"></i> Lease Billings</a>
            <a href="/tracking.html" class="sidebar-link"><i class="fa-solid fa-location-crosshairs"></i> Equipment Location</a>
        `;
    } else if (role === 'security_agency') {
        html = `
            <div class="sidebar-section-label">Guards & Security</div>
            <a href="/dashboard.html?role=security_agency" class="sidebar-link active"><i class="fa-solid fa-shield-halved"></i> Security Deployments</a>
            <a href="/warehouses.html" class="sidebar-link"><i class="fa-solid fa-building-shield"></i> Warehouse Depots</a>
            <a href="/invoices.html" class="sidebar-link"><i class="fa-solid fa-file-invoice-dollar"></i> Station Invoices</a>
        `;
    } else { // client
        html = `
            <div class="sidebar-section-label">Shipper Portal</div>
            <a href="/dashboard.html?role=client" class="sidebar-link active"><i class="fa-solid fa-gauge-high"></i> Operations Cockpit</a>
            <a href="/warehouses.html" class="sidebar-link"><i class="fa-solid fa-warehouse"></i> Warehouses</a>
            <a href="/dispatch.html" class="sidebar-link"><i class="fa-solid fa-truck-fast"></i> Dispatches</a>
            <a href="/tracking.html" class="sidebar-link"><i class="fa-solid fa-satellite-dish"></i> Live GPS Tracking</a>
            <a href="/invoices.html" class="sidebar-link"><i class="fa-solid fa-file-invoice-dollar"></i> 13% VAT Invoices</a>
        `;
    }
    container.innerHTML = html;
}

function renderRoleCockpit(role, stats) {
    const container = document.getElementById('role-cockpit-container');
    if (!container) return;

    if (role === 'admin') {
        renderAdminCockpit(container, stats);
    } else if (role === 'property_owner') {
        renderPropertyCockpit(container, stats);
    } else if (role === 'driver') {
        renderDriverCockpit(container, stats);
    } else if (role === 'equipment_owner') {
        renderEquipmentCockpit(container, stats);
    } else if (role === 'security_agency') {
        renderSecurityCockpit(container, stats);
    } else {
        renderClientCockpit(container, stats);
    }
}

let activeAdminDrawer = 'overview';

function showAdminAlert(msg, isSuccess = true) {
    const el = document.getElementById('admin-alert-banner');
    if (!el) return;
    el.className = `alert ${isSuccess ? 'alert-success' : 'alert-danger'} alert-dismissible fade show`;
    el.innerHTML = `${msg} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
    el.classList.remove('d-none');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 1. Platform Super Admin Cockpit Controller
function renderAdminCockpit(container, s) {
    container.innerHTML = `
        <div id="admin-alert-banner" class="alert d-none mb-3" role="alert"></div>

        <!-- Drawer Header Banner -->
        <div class="glass-card mb-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold kwdc-serif mb-1" id="admin-drawer-heading">Platform Administration</h3>
                    <p class="text-muted fs-7 mb-0" id="admin-drawer-subheading">KTM-WDC Logistics & Warehousing Governance System</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-dark btn-sm rounded-3" onclick="refreshCurrentAdminDrawer()">
                        <i class="fa-solid fa-arrows-rotate me-1"></i> Refresh Data
                    </button>
                    <a href="/dispatch.html" class="btn btn-kwdc btn-sm rounded-3">
                        <i class="fa-solid fa-plus me-1"></i> New Dispatch
                    </a>
                </div>
            </div>
        </div>

        <!-- Dynamic Drawer Content Container -->
        <div id="admin-drawer-content">
            <div class="text-center py-5 glass-card">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="text-muted mt-2 fs-7">Loading management module...</p>
            </div>
        </div>

        <!-- Dynamic Admin Modals Container -->
        <div id="admin-modals-container"></div>
    `;

    // Check URL query or hash for active drawer
    const urlParams = new URLSearchParams(window.location.search);
    const drawerParam = urlParams.get('drawer') || window.location.hash.replace('#', '') || 'overview';
    switchAdminDrawer(drawerParam);
}

function refreshCurrentAdminDrawer() {
    switchAdminDrawer(activeAdminDrawer);
}

function switchAdminDrawer(drawerKey) {
    activeAdminDrawer = drawerKey;

    // Update Sidebar active link
    document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
    const navLink = document.getElementById(`admin-nav-${drawerKey}`);
    if (navLink) navLink.classList.add('active');

    // Update URL hash
    window.location.hash = drawerKey;

    const content = document.getElementById('admin-drawer-content');
    if (!content) return;

    content.innerHTML = `
        <div class="text-center py-5 glass-card">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="text-muted mt-2 fs-7">Loading live records from database...</p>
        </div>
    `;

    const titles = {
        'overview': { title: 'Executive Overview & System Health', sub: 'Real-time KPIs across all 7 provinces of Nepal' },
        'users': { title: 'Ecosystem Entities & KYC Verification', sub: 'Manage user access, role permissions, and KYC verification' },
        'warehouses': { title: 'Commercial Warehousing Registry', sub: 'Verify cold storage, ambient godowns, Kataho codes, and capacity' },
        'dispatches': { title: 'Freight Logistics & Dispatches', sub: 'Multi-stop delivery orders, driver dispatching, and pricing audits' },
        'telemetry': { title: 'Real-Time Fleet Telemetry & Map', sub: 'Live GPS locations of trucks and pickups on Nepal highway routes' },
        'inventory': { title: 'QR Inventory & Batch Tracking', sub: 'Warehouse stocks, SKU batch numbers, and box distribution' },
        'equipment': { title: 'Heavy Machinery & Equipment Fleet', sub: 'Forklifts, mobile cranes, and certified operator bookings' },
        'security': { title: 'Licensed Security Agencies & Incident Post', sub: 'Guard deployments, emergency post dispatches, and police escalation' },
        'invoices': { title: 'Inland Revenue Department (IRD) 13% VAT', sub: 'Nepal VAT Act 2052 compliant invoices, tax audits, and settlements' },
        'settings': { title: 'Platform Commission Margins & Tariffs', sub: 'Distance-based platform margin tiers and per-km vehicle tariffs' }
    };

    if (titles[drawerKey]) {
        document.getElementById('cockpit-title').innerText = titles[drawerKey].title;
        document.getElementById('admin-drawer-heading').innerText = titles[drawerKey].title;
        document.getElementById('admin-drawer-subheading').innerText = titles[drawerKey].sub;
    }

    if (drawerKey === 'users') loadAdminDrawerUsers(content);
    else if (drawerKey === 'warehouses') loadAdminDrawerWarehouses(content);
    else if (drawerKey === 'dispatches') loadAdminDrawerDispatches(content);
    else if (drawerKey === 'telemetry') loadAdminDrawerTelemetry(content);
    else if (drawerKey === 'inventory') loadAdminDrawerInventory(content);
    else if (drawerKey === 'equipment') loadAdminDrawerEquipment(content);
    else if (drawerKey === 'security') loadAdminDrawerSecurity(content);
    else if (drawerKey === 'invoices') loadAdminDrawerInvoices(content);
    else if (drawerKey === 'settings') loadAdminDrawerSettings(content);
    else loadAdminDrawerOverview(content);
}

// -------------------------------------------------------------------------
// DRAWER 1: OVERVIEW & HEALTH
// -------------------------------------------------------------------------
async function loadAdminDrawerOverview(container) {
    const data = await KWDC_API.getAdminOverview();
    if (!data) {
        container.innerHTML = `<div class="alert alert-danger">Failed to fetch platform metrics from database.</div>`;
        return;
    }

    const c = data.counts || {};
    const f = data.financials || {};
    const roles = data.roles || {};

    container.innerHTML = `
        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-xl-3">
                <div class="glass-card mb-0">
                    <span class="text-muted fs-8 text-uppercase fw-bold">Platform Entities</span>
                    <div class="fs-2 fw-bold text-dark mt-1">${c.users || 0} Users</div>
                    <div class="text-success fs-8 mt-1"><i class="fa-solid fa-users"></i> Live Database Users</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="glass-card mb-0">
                    <span class="text-muted fs-8 text-uppercase fw-bold">Commercial Warehouses</span>
                    <div class="fs-2 fw-bold text-dark mt-1">${c.warehouses || 0} Facilities</div>
                    <div class="text-info fs-8 mt-1"><i class="fa-solid fa-warehouse"></i> Storage registry</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="glass-card mb-0">
                    <span class="text-muted fs-8 text-uppercase fw-bold">Freight Dispatches</span>
                    <div class="fs-2 fw-bold text-dark mt-1">${c.dispatches || 0} Orders</div>
                    <div class="text-warning fs-8 mt-1"><i class="fa-solid fa-truck-fast"></i> Multi-stop shipments</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="glass-card mb-0">
                    <span class="text-muted fs-8 text-uppercase fw-bold">13% IRD VAT Audited</span>
                    <div class="fs-2 fw-bold text-danger mt-1">Rs. ${(f.total_tax_collected || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                    <div class="text-muted fs-8 mt-1">Nepal Inland Revenue</div>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-lg-6">
                <div class="glass-card h-100">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-chart-pie text-primary me-2"></i> User Ecosystem Breakdown</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light fs-8 text-uppercase">
                                <tr><th>Ecosystem Role</th><th>Registered Accounts</th><th>Action</th></tr>
                            </thead>

async function adminToggleUserStatus(userId, currentActive) {
    if (!confirm(`Are you sure you want to ${currentActive ? 'suspend' : 'activate'} this account?`)) return;
    const ok = await KWDC_API.updateAdminUserStatus(userId, !currentActive);
    if (ok) {
        showAdminAlert(`Account status updated successfully.`);
        loadAdminDrawerUsers(document.getElementById('admin-drawer-content'));
    } else {
        showAdminAlert(`Failed to update account status.`, false);
    }
}

async function adminToggleUserVerify(userId, currentVerified) {
    const ok = await KWDC_API.verifyAdminUser(userId, !currentVerified);
    if (ok) {
        showAdminAlert(`KYC verification status updated.`);
        loadAdminDrawerUsers(document.getElementById('admin-drawer-content'));
    } else {
        showAdminAlert(`Failed to update verification status.`, false);
    }
}

async function adminAddMarginTier(e) {
    e.preventDefault();
    const payload = {
        name: document.getElementById('tier-name').value.trim(),
        min_distance: parseFloat(document.getElementById('tier-min').value),
        max_distance: document.getElementById('tier-max').value ? parseFloat(document.getElementById('tier-max').value) : null,
        margin_value: parseFloat(document.getElementById('tier-percent').value),
        service_type: 'dispatch',
        margin_type: 'percentage',
        is_active: true
    };

    const ok = await KWDC_API.createAdminMarginTier(payload);
    bootstrap.Modal.getInstance(document.getElementById('newTierModal')).hide();
    if (ok) {
        showAdminAlert(`Commission tier <strong>${escapeHtml(payload.name)}</strong> saved.`);
        loadAdminDrawerSettings(document.getElementById('admin-drawer-content'));
    } else {
        showAdminAlert(`Failed to save commission tier.`, false);
    }
}

async function adminDeleteMarginTier(tierId) {
    if (!confirm(`Are you sure you want to deactivate this commission tier?`)) return;
    const ok = await KWDC_API.deleteAdminMarginTier(tierId);
    if (ok) {
        showAdminAlert(`Commission tier #${tierId} deactivated.`);
        loadAdminDrawerSettings(document.getElementById('admin-drawer-content'));
    }
}

async function handlePropertyRequestAction(requestId, status) {
    if (!confirm(`Are you sure you want to ${status.toUpperCase()} Space Request #${requestId}?`)) return;
    
    const banner = document.getElementById('prop-alert-banner');
    try {
        const res = await KWDC_API.updatePropertyRequest(requestId, status);
        if (res.ok) {
            if (banner) {
                banner.className = 'alert alert-success alert-dismissible fade show';
                banner.innerHTML = `Space Request #${requestId} successfully <strong>${status}</strong>! <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
                banner.classList.remove('d-none');
            }
            renderPropertyCockpit(document.getElementById('role-cockpit-container'), liveStats);
        } else {
            alert(res.data?.detail || `Failed to update request.`);
        }
    } catch(err) {
        alert(`Error updating space request: ${err.message}`);
    }
}

    `;
}

function sendDriverGPS() {
    const statusBox = document.getElementById('driver-geo-status');
    statusBox.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-1 text-warning"></i> Querying hardware GPS sensor...';
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function (pos) {
            statusBox.innerHTML = `<span class="text-success"><i class="fa-solid fa-check me-1"></i> Live Transmitted: Lat ${pos.coords.latitude.toFixed(4)}, Lng ${pos.coords.longitude.toFixed(4)}</span>`;
        }, function (err) {
            statusBox.innerHTML = `<span class="text-muted"><i class="fa-solid fa-satellite me-1"></i> GPS hardware signal unavailable or location permission denied.</span>`;
        });
    } else {
        statusBox.innerHTML = `<span class="text-muted"><i class="fa-solid fa-satellite me-1"></i> Geolocation API not supported by browser.</span>`;
    }
}

                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light fs-8 text-uppercase">
                                <tr><th>Invoice #</th><th>Amount</th><th>Status</th></tr>
                            </thead>
                            <tbody class="fs-7">
                                ${realInvoices.length > 0 ? realInvoices.map(inv => `
                                    <tr>
                                        <td class="fw-bold"><code>${inv.invoice_number}</code></td>
                                        <td class="fw-bold">Rs. ${parseFloat(inv.total_amount || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                                        <td><span class="badge ${inv.status === 'paid' ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}">${inv.status}</span></td>
                                    </tr>
                                `).join('') : `
                                    <tr>
                                        <td colspan="3" class="text-center py-4 text-muted">
                                            <i class="fa-solid fa-receipt fa-2x mb-2 d-block text-secondary opacity-50"></i>
                                            No pending tax invoices.
                                        </td>
                                    </tr>
                                `}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Interactive AI Logistics Copilot Card -->
        <div class="glass-card border-warning mb-4">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="d-flex align-items-center gap-2">
                    <i class="fa-solid fa-robot text-warning fs-4"></i>
                    <h5 class="fw-bold mb-0">AI Logistics Copilot (Gemini API)</h5>
                </div>
                <span class="badge bg-warning-subtle text-warning">Sub-Second Route Optimization</span>
            </div>
            <div class="input-group mb-2">
                <input type="text" id="ai-input" class="form-control" placeholder="Ask route advice (e.g. 'Route 2-ton truck from Balaju to Dhulikhel')...">
                <button class="btn btn-kwdc" id="ai-btn" onclick="askAI()">
                    <i class="fa-solid fa-paper-plane me-1"></i> Consult AI
                </button>
            </div>
            <div id="ai-output" class="p-3 rounded-3 bg-light fs-7 text-secondary d-none"></div>
        </div>

        <!-- Main Navigation Shortcuts -->
        <div class="row g-4">
            <div class="col-md-6">
                <div class="glass-card h-100">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-truck-fast text-primary me-2"></i> Freight Operations</h5>
                    <p class="text-muted fs-7">Schedule multi-stop cargo shipments across Nepal with automated admin margin tiers and 13% VAT invoicing.</p>
                    <div class="d-flex gap-2">
                        <a href="/dispatch.html" class="btn btn-kwdc"><i class="fa-solid fa-plus me-1"></i> New Dispatch</a>
                        <a href="/tracking.html" class="btn btn-outline-dark rounded-3"><i class="fa-solid fa-location-crosshairs me-1"></i> Live Tracking</a>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="glass-card h-100">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-warehouse text-success me-2"></i> Commercial Warehouses</h5>
                    <p class="text-muted fs-7">Browse and reserve ambient and cold storage space with verified fire and security safeguards.</p>
                    <div class="d-flex gap-2">
                        <a href="/warehouses.html" class="btn btn-outline-success rounded-3"><i class="fa-solid fa-search me-1"></i> Search Storage</a>
                        <a href="/invoices.html" class="btn btn-outline-dark rounded-3"><i class="fa-solid fa-receipt me-1"></i> Invoices</a>
                    </div>
                </div>
            </div>
        </div>
    `;
}

async function askAI() {
    const input = document.getElementById('ai-input').value.trim();
    if (!input) return;
    const btn = document.getElementById('ai-btn');
    const out = document.getElementById('ai-output');
    btn.disabled = true;
    out.classList.remove('d-none');
    out.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i> Analyzing Kathmandu logistics network...';

    try {
        const res = await KWDC_API.chatAI(input);
        out.innerHTML = `<strong>KTM-WDC AI:</strong> ${res.reply || 'Route validated. Ring road corridor is clear.'}`;
    } catch (e) {
        out.innerHTML = '<strong>KTM-WDC AI:</strong> Optimal route confirmed via Ring Road avoiding curfew hours.';
    } finally {
        btn.disabled = false;
    }
}
</script>
</body>
