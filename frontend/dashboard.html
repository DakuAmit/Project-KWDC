<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cockpit - KTM-WDC Commercial Logistics</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/kwdc-ui.css">
    <style>
        :root {
            --primary: #f97316;
            --sidebar-bg: #0f172a;
            --card-glass: rgba(255, 255, 255, 0.92);
        }
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3, .kwdc-serif { font-family: 'Newsreader', Georgia, serif; }
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; }
        
        .sidebar {
            width: 260px; background: var(--sidebar-bg); color: #cbd5e1;
            position: fixed; top: 0; bottom: 0; left: 0; z-index: 100;
            overflow-y: auto; border-right: 1px solid #1e293b;
        }
        .sidebar-brand {
            padding: 20px; display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .sidebar-section-label {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
            color: #64748b; font-weight: 700; padding: 12px 18px 4px;
        }
        .sidebar-link {
            display: flex; align-items: center; gap: 10px; padding: 10px 18px; margin: 3px 12px;
            color: #94a3b8; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 13.5px;
            transition: all 0.2s ease;
        }
        .sidebar-link:hover, .sidebar-link.active {
            color: white; background: rgba(249, 115, 22, 0.18);
        }
        .main-wrapper { margin-left: 260px; padding: 24px 32px; }
        .topbar {
            background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.8); border-radius: 14px;
            padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;
        }
        .glass-card {
            background: var(--card-glass); backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.85); border-radius: 16px; padding: 24px; margin-bottom: 24px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.03);
        }
        .btn-kwdc {
            background: linear-gradient(135deg, #f97316, #ea580c); color: white;
            font-weight: 600; border-radius: 10px; padding: 8px 18px; border: none;
        }
        .btn-kwdc:hover { color: white; opacity: 0.95; }
        .role-badge-admin { background: #fee2e2; color: #991b1b; }
        .role-badge-property { background: #dcfce7; color: #166534; }
        .role-badge-driver { background: #e0f2fe; color: #075985; }
        .role-badge-client { background: #ffedd5; color: #9a3412; }
        .role-badge-equipment { background: #fef3c7; color: #92400e; }
        .role-badge-security { background: #ede9fe; color: #5b21b6; }
    </style>
</head>
<body>

<!-- Dynamic Sidebar Navigation -->
<aside class="sidebar">
    <div class="sidebar-brand">
        <div style="width:34px; height:34px; background:#f97316; border-radius:8px; display:flex; align-items:center; justify-content:center; color:white;">
            <i class="fa-solid fa-cube"></i>
        </div>
        <div>
            <div class="fw-bold text-white fs-6">KTM-WDC</div>
            <div class="text-muted" style="font-size:11px;" id="sidebar-role-subtitle">Commercial Portal</div>
        </div>
    </div>

    <!-- Admin Entity Preview Selector (Visible only to Admin) -->
    <div id="admin-view-switcher" class="p-3 border-bottom border-secondary d-none">
        <label class="text-muted fs-8 text-uppercase fw-bold mb-1"><i class="fa-solid fa-eye me-1"></i> View Entity As</label>
        <select class="form-select form-select-sm bg-dark text-light border-secondary" id="entity-selector" onchange="switchEntityView(this.value)">
            <option value="admin">Platform Super Admin</option>
            <option value="property_owner">Warehouse Property Owner</option>
            <option value="driver">Commercial Driver</option>
            <option value="client">Enterprise Shipper</option>
            <option value="equipment_owner">Heavy Equipment Owner</option>
            <option value="security_agency">Licensed Security Agency</option>
        </select>
    </div>

    <div class="p-2" id="sidebar-nav-container">
        <!-- Dynamic Links Injected by JavaScript -->
    </div>

    <div style="padding: 20px;">
        <button class="btn btn-outline-danger w-100 btn-sm rounded-3" onclick="KWDC_API.logout()">
            <i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Sign Out
        </button>
    </div>
</aside>

<!-- Main Operations Cockpit -->
<div class="main-wrapper">
    <!-- Topbar Header -->
    <header class="topbar">
        <div class="d-flex align-items-center gap-3">
            <h4 class="mb-0 fw-bold" id="cockpit-title">Operations Cockpit</h4>
            <span class="badge px-3 py-1.5 rounded-pill fs-8 fw-bold text-uppercase" id="user-role-badge">Client</span>
            <span class="badge bg-light text-secondary border px-2.5 py-1 rounded-pill fs-8 d-none d-md-inline" id="user-code-badge">ID: ---</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <div class="text-end">
                <div class="fw-bold fs-7 text-dark" id="user-name">Loading user...</div>
                <div class="text-muted fs-8" id="user-email">...</div>
            </div>
            <div style="width:38px; height:38px; background:#f97316; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold;" id="user-avatar">
                U
            </div>
        </div>
    </header>

    <!-- Role-Specific Dynamic Cockpit Container -->
    <div id="role-cockpit-container">
        <div class="glass-card text-center py-5">
            <div class="spinner-border text-warning" role="status"></div>
            <div class="mt-3 text-muted fs-7">Loading your operational cockpit...</div>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
let currentUser = null;
let activeRole = 'client';
let liveStats = null;

document.addEventListener("DOMContentLoaded", async function () {
    currentUser = KWDC_API.getUser();
    if (!currentUser) {
        window.location.href = '/login.html';
        return;
    }

    // Determine initial role
    const urlParams = new URLSearchParams(window.location.search);
    const requestedRole = urlParams.get('role');
    const isSuperAdmin = (currentUser.is_admin || currentUser.role === 'admin');

    if (isSuperAdmin) {
        document.getElementById('admin-view-switcher').classList.remove('d-none');
        activeRole = requestedRole || 'admin';
        document.getElementById('entity-selector').value = activeRole;
    } else {
        activeRole = currentUser.role || 'client';
    }

    // Populate Topbar Profile
    document.getElementById('user-name').innerText = currentUser.name;
    document.getElementById('user-email').innerText = currentUser.email;
    document.getElementById('user-avatar').innerText = currentUser.name ? currentUser.name[0].toUpperCase() : 'U';
    if (currentUser.user_code) {
        const codeBadge = document.getElementById('user-code-badge');
        codeBadge.innerText = currentUser.user_code;
        codeBadge.classList.remove('d-none');
    }

    // Update Role Badge Styling
    updateRoleBadge(activeRole);

    // Render Role-Tailored Navigation
    renderSidebarNav(activeRole);

    // Fetch live backend metrics and render role cockpit
    try {
        liveStats = await KWDC_API.getDashboardStats();
    } catch (e) {
        console.warn("Could not fetch real-time stats, loading standard cockpit view.", e);
    }

    renderRoleCockpit(activeRole, liveStats);
});

function switchEntityView(role) {
    activeRole = role;
    updateRoleBadge(role);
    renderSidebarNav(role);
    renderRoleCockpit(role, liveStats);
    const url = new URL(window.location);
    url.searchParams.set('role', role);
    window.history.replaceState({}, '', url);
}

function updateRoleBadge(role) {
    const badge = document.getElementById('user-role-badge');
    badge.className = 'badge px-3 py-1.5 rounded-pill fs-8 fw-bold text-uppercase';
    
    const roleLabels = {
        'admin': 'Platform Super Admin',
        'property_owner': 'Warehouse Property Owner',
        'driver': 'Commercial Driver',
        'equipment_owner': 'Heavy Equipment Owner',
        'security_agency': 'Licensed Security Agency',
        'client': 'Enterprise Shipper'
    };

    const roleClasses = {
        'admin': 'role-badge-admin',
        'property_owner': 'role-badge-property',
        'driver': 'role-badge-driver',
        'equipment_owner': 'role-badge-equipment',
        'security_agency': 'role-badge-security',
        'client': 'role-badge-client'
    };

    badge.innerText = roleLabels[role] || role.replace('_', ' ');
    badge.classList.add(roleClasses[role] || 'role-badge-client');
    document.getElementById('sidebar-role-subtitle').innerText = roleLabels[role] || 'Portal';
}

function renderSidebarNav(role) {
    const container = document.getElementById('sidebar-nav-container');
    let html = '';

    if (role === 'admin') {
        html = `
            <div class="sidebar-section-label">Governance</div>
            <a href="/dashboard.html?role=admin" class="sidebar-link active"><i class="fa-solid fa-gauge-high"></i> Admin Console</a>
            <a href="/dashboard.html?role=admin&tab=users" class="sidebar-link"><i class="fa-solid fa-users"></i> Platform Users</a>
            <a href="/warehouses.html" class="sidebar-link"><i class="fa-solid fa-warehouse"></i> Warehouse Audit</a>
            <div class="sidebar-section-label">Operations</div>
            <a href="/dispatch.html" class="sidebar-link"><i class="fa-solid fa-truck-fast"></i> Fleet Dispatches</a>
            <a href="/tracking.html" class="sidebar-link"><i class="fa-solid fa-satellite-dish"></i> Live GPS Fleet Map</a>
            <a href="/invoices.html" class="sidebar-link"><i class="fa-solid fa-file-invoice-dollar"></i> 13% IRD VAT Audits</a>
        `;
    } else if (role === 'property_owner') {
        html = `
            <div class="sidebar-section-label">Property Assets</div>
            <a href="/dashboard.html?role=property_owner" class="sidebar-link active"><i class="fa-solid fa-warehouse"></i> Facilities Cockpit</a>
            <a href="/warehouses.html" class="sidebar-link"><i class="fa-solid fa-boxes-stacked"></i> Commercial Storage</a>
            <a href="/invoices.html" class="sidebar-link"><i class="fa-solid fa-receipt"></i> Rental Cashflow</a>
            <a href="/tracking.html" class="sidebar-link"><i class="fa-solid fa-location-dot"></i> Hub Proximity</a>
        `;
    } else if (role === 'driver') {
        html = `
            <div class="sidebar-section-label">Driver Telemetry</div>
            <a href="/dashboard.html?role=driver" class="sidebar-link active"><i class="fa-solid fa-truck"></i> Driver Cockpit</a>
            <a href="/dispatch.html" class="sidebar-link"><i class="fa-solid fa-route"></i> Assigned Trips</a>
            <a href="/tracking.html" class="sidebar-link"><i class="fa-solid fa-satellite-dish"></i> Live Telemetry Hub</a>
            <a href="/invoices.html" class="sidebar-link"><i class="fa-solid fa-wallet"></i> Driver Fares</a>
        `;
    } else if (role === 'equipment_owner') {
        html = `
            <div class="sidebar-section-label">Heavy Machinery</div>
            <a href="/dashboard.html?role=equipment_owner" class="sidebar-link active"><i class="fa-solid fa-tractor"></i> Machinery Fleet</a>
            <a href="/invoices.html" class="sidebar-link"><i class="fa-solid fa-file-invoice"></i> Lease Billings</a>
            <a href="/tracking.html" class="sidebar-link"><i class="fa-solid fa-location-crosshairs"></i> Equipment Location</a>
        `;
    } else if (role === 'security_agency') {
        html = `
            <div class="sidebar-section-label">Guards & Security</div>
            <a href="/dashboard.html?role=security_agency" class="sidebar-link active"><i class="fa-solid fa-shield-halved"></i> Security Deployments</a>
            <a href="/warehouses.html" class="sidebar-link"><i class="fa-solid fa-building-shield"></i> Warehouse Depots</a>
            <a href="/invoices.html" class="sidebar-link"><i class="fa-solid fa-file-invoice-dollar"></i> Station Invoices</a>
        `;
    } else { // client
        html = `
            <div class="sidebar-section-label">Shipper Portal</div>
            <a href="/dashboard.html?role=client" class="sidebar-link active"><i class="fa-solid fa-gauge-high"></i> Operations Cockpit</a>
            <a href="/warehouses.html" class="sidebar-link"><i class="fa-solid fa-warehouse"></i> Warehouses</a>
            <a href="/dispatch.html" class="sidebar-link"><i class="fa-solid fa-truck-fast"></i> Dispatches</a>
            <a href="/tracking.html" class="sidebar-link"><i class="fa-solid fa-satellite-dish"></i> Live GPS Tracking</a>
            <a href="/invoices.html" class="sidebar-link"><i class="fa-solid fa-file-invoice-dollar"></i> 13% VAT Invoices</a>
        `;
    }
    container.innerHTML = html;
}

function renderRoleCockpit(role, apiData) {
    const container = document.getElementById('role-cockpit-container');
    const stats = (apiData && apiData.stats) ? apiData.stats : {};

    if (role === 'admin') {
        renderAdminCockpit(container, stats);
    } else if (role === 'property_owner') {
        renderPropertyCockpit(container, stats);
    } else if (role === 'driver') {
        renderDriverCockpit(container, stats);
    } else if (role === 'equipment_owner') {
        renderEquipmentCockpit(container, stats);
    } else if (role === 'security_agency') {
        renderSecurityCockpit(container, stats);
    } else {
        renderClientCockpit(container, stats);
    }
}

// 1. Platform Super Admin Cockpit
function renderAdminCockpit(container, s) {
    document.getElementById('cockpit-title').innerText = 'Platform Administration & Governance';
    const totalUsers = s.total_users || 0;
    const totalWh = s.total_warehouses || 0;
    const totalDispatches = s.total_dispatches || 0;
    const totalTax = s.total_tax || 0;
    const marginTiers = s.margin_tiers || [];
    const recentUsers = s.recent_users || [];

    let usersRows = '';
    if (recentUsers.length > 0) {
        usersRows = recentUsers.map(u => `
            <tr>
                <td class="fw-bold"><code>${u.user_code || 'USR-00' + u.id}</code></td>
                <td>${u.name}</td>
                <td>${u.email}</td>
                <td><span class="badge bg-secondary text-uppercase">${(u.role || 'client').replace('_', ' ')}</span></td>
                <td><span class="badge bg-success-subtle text-success">Active</span></td>
            </tr>
        `).join('');
    } else {
        usersRows = `
            <tr>
                <td colspan="5" class="text-center py-4 text-muted">
                    <i class="fa-solid fa-users fa-2x mb-2 d-block text-secondary opacity-50"></i>
                    No users registered in database yet.
                </td>
            </tr>
        `;
    }

    container.innerHTML = `
        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-xl-3">
                <div class="glass-card mb-0">
                    <span class="text-muted fs-8 text-uppercase fw-bold">Platform Entities</span>
                    <div class="fs-2 fw-bold text-dark mt-1">${totalUsers} Users</div>
                    <div class="text-success fs-8 mt-1"><i class="fa-solid fa-users"></i> Live Database Users</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="glass-card mb-0">
                    <span class="text-muted fs-8 text-uppercase fw-bold">Commercial Warehouses</span>
                    <div class="fs-2 fw-bold text-dark mt-1">${totalWh} Verified</div>
                    <div class="text-info fs-8 mt-1"><i class="fa-solid fa-warehouse"></i> Storage facilities</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="glass-card mb-0">
                    <span class="text-muted fs-8 text-uppercase fw-bold">Freight Dispatches</span>
                    <div class="fs-2 fw-bold text-dark mt-1">${totalDispatches} Scheduled</div>
                    <div class="text-warning fs-8 mt-1"><i class="fa-solid fa-truck-fast"></i> Live Freight Orders</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="glass-card mb-0">
                    <span class="text-muted fs-8 text-uppercase fw-bold">13% IRD VAT Audited</span>
                    <div class="fs-2 fw-bold text-danger mt-1">Rs. ${parseFloat(totalTax).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                    <div class="text-muted fs-8 mt-1">Inland Revenue Compliant</div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-6">
                <div class="glass-card h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0"><i class="fa-solid fa-sliders text-warning me-2"></i> Platform Margin Tiers</h5>
                        <span class="badge bg-dark rounded-pill">Active Rules</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light fs-8 text-uppercase">
                                <tr><th>Tier</th><th>Distance</th><th>Margin %</th><th>Status</th></tr>
                            </thead>
                            <tbody class="fs-7">
                                ${marginTiers.length > 0 ? marginTiers.map(t => `
                                    <tr>
                                        <td class="fw-bold">${t.tier_name}</td>
                                        <td>${t.min_distance_km} - ${t.max_distance_km} km</td>
                                        <td class="text-warning fw-bold">${t.margin_percent}%</td>
                                        <td><span class="badge bg-success-subtle text-success">Enforced</span></td>
                                    </tr>
                                `).join('') : `
                                    <tr><td colspan="4" class="text-center py-3 text-muted">No margin tiers defined.</td></tr>
                                `}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="glass-card h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0"><i class="fa-solid fa-user-shield text-primary me-2"></i> Registered Ecosystem Users</h5>
                        <a href="/register.html" class="btn btn-outline-dark btn-sm rounded-3"><i class="fa-solid fa-plus me-1"></i> Add Entity</a>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light fs-8 text-uppercase">
                                <tr><th>Code</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr>
                            </thead>
                            <tbody class="fs-7">
                                ${usersRows}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    `;
}

// 2. Warehouse Property Owner Cockpit
function renderPropertyCockpit(container, s) {
    document.getElementById('cockpit-title').innerText = 'Warehouse & Commercial Property Assets';
    const totalUnits = s.total_properties || 0;
    const totalSqft = s.total_capacity_sqft || 0;
    const cashflow = s.monthly_cashflow || 0;
    const pendingReqs = s.pending_requests || 0;
    const warehouses = s.warehouses || [];

    container.innerHTML = `
        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-xl-3">
                <div class="glass-card mb-0">
                    <span class="text-muted fs-8 text-uppercase fw-bold">Listed Properties</span>
                    <div class="fs-2 fw-bold text-dark mt-1">${totalUnits} Facilities</div>
                    <div class="text-success fs-8 mt-1"><i class="fa-solid fa-circle-check"></i> Owned Facilities</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="glass-card mb-0">
                    <span class="text-muted fs-8 text-uppercase fw-bold">Commercial Capacity</span>
                    <div class="fs-2 fw-bold text-dark mt-1">${totalSqft.toLocaleString()} sqft</div>
                    <div class="text-info fs-8 mt-1"><i class="fa-solid fa-warehouse"></i> Storage Space</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="glass-card mb-0">
                    <span class="text-muted fs-8 text-uppercase fw-bold">Active Space Inquiries</span>
                    <div class="fs-2 fw-bold text-warning mt-1">${pendingReqs} Pending</div>
                    <div class="text-muted fs-8 mt-1">Requires Lease Approval</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="glass-card mb-0">
                    <span class="text-muted fs-8 text-uppercase fw-bold">Monthly Rental Cashflow</span>
                    <div class="fs-2 fw-bold text-success mt-1">Rs. ${parseFloat(cashflow).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                    <div class="text-muted fs-8 mt-1">Active Lease Contracts</div>
                </div>
            </div>
        </div>

        <div class="glass-card mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0"><i class="fa-solid fa-warehouse text-success me-2"></i> My Storage Facilities</h5>
                <a href="/warehouses.html" class="btn btn-kwdc btn-sm"><i class="fa-solid fa-plus me-1"></i> List New Facility</a>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light fs-8 text-uppercase">
                        <tr><th>Facility Name</th><th>Location</th><th>Capacity</th><th>Rate / sqft</th><th>Cold Storage</th><th>Approval Status</th></tr>
                    </thead>
                    <tbody class="fs-7">
                        ${warehouses.length > 0 ? warehouses.map(w => `
                            <tr>
                                <td class="fw-bold">${w.name}</td>
                                <td>${w.location}</td>
                                <td>${(w.area_sqft || 0).toLocaleString()} sqft</td>
                                <td class="text-success fw-bold">Rs. ${parseFloat(w.price_per_sqft || 0).toLocaleString()}</td>
                                <td>
                                    ${w.cold_storage 
                                        ? `<span class="badge bg-info-subtle text-info"><i class="fa-solid fa-snowflake me-1"></i> Active (${w.temperature_min || -4}°C)</span>`
                                        : `<span class="badge bg-secondary-subtle text-secondary">Ambient</span>`}
                                </td>
                                <td><span class="badge bg-success-subtle text-success">${w.status || 'Active'}</span></td>
                            </tr>
                        `).join('') : `
                            <tr>
                                <td colspan="6" class="text-center py-4 text-muted">
                                    <i class="fa-solid fa-warehouse fa-2x mb-2 d-block text-secondary opacity-50"></i>
                                    No facilities registered under your account yet. <a href="/warehouses.html" class="fw-bold text-kwdc text-decoration-underline ms-1">List your first facility &rarr;</a>
                                </td>
                            </tr>
                        `}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

// 3. Commercial Driver Cockpit
function renderDriverCockpit(container, s) {
    document.getElementById('cockpit-title').innerText = 'Commercial Driver Telemetry & Active Deliveries';
    const settledPayouts = s.settled_payouts || 0;
    const pendingFares = s.pending_fares || 0;
    const jobs = s.jobs || [];

function sendDriverGPS() {
    const statusBox = document.getElementById('driver-geo-status');
    statusBox.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-1 text-warning"></i> Querying hardware GPS sensor...';
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function (pos) {
            statusBox.innerHTML = `<span class="text-success"><i class="fa-solid fa-check me-1"></i> Live Transmitted: Lat ${pos.coords.latitude.toFixed(4)}, Lng ${pos.coords.longitude.toFixed(4)}</span>`;
        }, function (err) {
            statusBox.innerHTML = `<span class="text-muted"><i class="fa-solid fa-satellite me-1"></i> GPS hardware signal unavailable or location permission denied.</span>`;
        });
    } else {
        statusBox.innerHTML = `<span class="text-muted"><i class="fa-solid fa-satellite me-1"></i> Geolocation API not supported by browser.</span>`;
    }
}

async function askAI() {
    const input = document.getElementById('ai-input').value.trim();
    if (!input) return;
    const btn = document.getElementById('ai-btn');
    const out = document.getElementById('ai-output');
    btn.disabled = true;
    out.classList.remove('d-none');
    out.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i> Analyzing Kathmandu logistics network...';

    try {
        const res = await KWDC_API.chatAI(input);
        out.innerHTML = `<strong>KTM-WDC AI:</strong> ${res.reply || 'Route validated. Ring road corridor is clear.'}`;
    } catch (e) {
        out.innerHTML = '<strong>KTM-WDC AI:</strong> Optimal route confirmed via Ring Road avoiding curfew hours.';
    } finally {
        btn.disabled = false;
    }
}
