<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Shipper Account - KTM-WDC</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #f97316; }
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3, .kwdc-serif { font-family: 'Newsreader', Georgia, serif; }
        body { background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 0; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.85);
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 520px;
        }
        .btn-kwdc {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            font-weight: 600;
            border-radius: 10px;
            padding: 10px;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-kwdc:hover { color: white; transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="glass-card">
    <div class="text-center mb-4">
        <h3 class="fw-bold kwdc-serif text-dark mb-1">Create Account</h3>
        <p class="text-muted fs-7">Join Nepal's Commercial Logistics Platform</p>
    </div>

    <form id="reg-form">
        <div class="mb-3">
            <label class="form-label fs-7 fw-bold">Company / Shipper Name</label>
            <input type="text" id="name" class="form-control" placeholder="e.g. Pokhara Fresh Logistics" required>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-md-6">
                <label class="form-label fs-7 fw-bold">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="contact@company.np" required>
            </div>
            <div class="col-md-6">
                <label class="form-label fs-7 fw-bold">Mobile Phone</label>
                <input type="tel" id="phone" class="form-control" placeholder="98XXXXXXXX" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fs-7 fw-bold">Ecosystem Role</label>
            <select id="role" class="form-select">
                <option value="client" selected>Enterprise Client / Shipper</option>
                <option value="driver">Commercial Driver</option>
                <option value="property_owner">Warehouse Property Owner</option>
                <option value="equipment_owner">Heavy Equipment Owner</option>
                <option value="security_agency">Licensed Security Agency</option>
            </select>
        </div>

        <div class="mb-4">
            <label class="form-label fs-7 fw-bold">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Min. 8 characters" value="KwdcNew2026!" required>
        </div>

        <button type="submit" class="btn btn-kwdc w-100 py-2.5 fs-6">
            <i class="fa-solid fa-check me-2"></i> Register Account
        </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top fs-7 text-muted">
        Already registered? <a href="/login.html" class="text-warning fw-bold text-decoration-none">Sign In</a>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
document.getElementById('reg-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    alert('Account created! Please sign in with your credentials.');
    window.location.href = '/login.html';
});
</script>
</body>
</html>
