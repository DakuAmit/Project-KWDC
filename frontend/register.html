<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - KTM-WDC Logistics</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #f97316; --primary-hover: #ea580c; }
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3, .kwdc-serif { font-family: 'Newsreader', Georgia, serif; }
        body { background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 45px -15px rgba(15, 23, 42, 0.08);
            width: 100%;
            max-width: 520px;
        }
        .btn-kwdc {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-kwdc:hover { color: white; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3); }
        .form-control, .form-select { border-radius: 10px; padding: 11px 14px; font-size: 14.5px; border-color: #cbd5e1; }
        .form-control:focus, .form-select:focus { border-color: #f97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15); }
    </style>
</head>
<body>

<div class="glass-card">
    <div class="text-center mb-4">
        <a href="/" style="text-decoration:none; display:inline-block;">
            <div style="width: 52px; height: 52px; background:#f97316; border-radius:14px; display:inline-flex; align-items:center; justify-content:center; color:white; font-size:24px; margin-bottom:12px; box-shadow:0 6px 16px rgba(249,115,22,0.35);">
                <i class="fa-solid fa-cube"></i>
            </div>
        </a>
        <h3 class="fw-bold kwdc-serif text-dark mb-1">Create Real Account</h3>
        <p class="text-muted fs-7">Join Nepal's Commercial Logistics & Warehousing Platform</p>
    </div>

    <div id="error-alert" class="alert alert-danger py-2.5 fs-7 d-none" role="alert"></div>

    <form id="reg-form">
        <div class="mb-3">
            <label class="form-label fs-7 fw-bold text-dark">Full Name or Company Name</label>
            <input type="text" id="name" class="form-control" placeholder="e.g. Pokhara Fresh Logistics Pvt Ltd" required>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-md-6">
                <label class="form-label fs-7 fw-bold text-dark">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="contact@company.com" required autocomplete="email">
            </div>
            <div class="col-md-6">
                <label class="form-label fs-7 fw-bold text-dark">Mobile Phone</label>
                <input type="tel" id="phone" class="form-control" placeholder="98XXXXXXXX" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fs-7 fw-bold text-dark">Ecosystem Role</label>
            <select id="role" class="form-select">
                <option value="client" selected>Enterprise Client / Shipper</option>
                <option value="property_owner">Warehouse Property Owner</option>
                <option value="driver">Commercial Driver</option>
                <option value="equipment_owner">Heavy Equipment Owner</option>
                <option value="security_agency">Licensed Security Agency</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label fs-7 fw-bold text-dark">Operating City / Address</label>
            <input type="text" id="address" class="form-control" placeholder="e.g. Birgunj Dry Port, Parsa">
        </div>

        <div class="mb-4">
            <label class="form-label fs-7 fw-bold text-dark">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Minimum 8 characters" minlength="8" required autocomplete="new-password">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-kwdc w-100 py-2.5 fs-6">
            <i class="fa-solid fa-user-plus me-2"></i> Register & Send Verification
        </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top fs-7 text-muted">
        Already registered? <a href="/login.html" class="fw-bold text-decoration-none" style="color: #ea580c;">Sign In here</a>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
document.getElementById('reg-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errBox = document.getElementById('error-alert');
    errBox.classList.add('d-none');

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const role = document.getElementById('role').value;
    const address = document.getElementById('address').value.trim();
    const password = document.getElementById('password').value;

    if (password.length < 8) {
        errBox.innerText = 'Password must be at least 8 characters long.';
        errBox.classList.remove('d-none');
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i> Creating Account & Sending Email...';

    try {
        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name,
                email,
                phone,
                role,
                address,
                password
            })
        });
        const data = await res.json();

        if (res.ok && data.access_token) {
            KWDC_API.setToken(data.access_token);
            KWDC_API.setUser(data.user);
            window.location.href = '/dashboard.html?registered=true';
        } else {
            errBox.innerText = data.detail || 'Registration failed. Please check your information.';
            errBox.classList.remove('d-none');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-user-plus me-2"></i> Register & Send Verification';
        }
    } catch(err) {
        errBox.innerText = 'Unable to connect to KTM-WDC server. Please try again.';
        errBox.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus me-2"></i> Register & Send Verification';
    }
});
</script>
</body>
</html>
