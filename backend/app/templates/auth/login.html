{% extends "base.html" %}

{% block title %}Sign In - KTM-WDC Logistics Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card shadow-lg p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="rounded-3 bg-warning text-white p-3 d-inline-flex mb-3 shadow-sm">
                    <i class="fa-solid fa-lock fs-4"></i>
                </div>
                <h3 class="fw-bold kwdc-serif text-slate-900">Welcome Back</h3>
                <p class="text-muted fs-7">Access your KTM-WDC Nepal commercial portal</p>
            </div>

            <!-- Quick Demo Role Switcher Pills -->
            <div class="mb-4">
                <label class="form-label text-muted fs-7 fw-bold text-uppercase">1-Click Demo Fill:</label>
                <div class="d-flex flex-wrap gap-2">
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="fillCreds('admin.access@kwdc.test')">Admin</button>
                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="fillCreds('client.access@kwdc.test')">Client</button>
                    <button type="button" class="btn btn-sm btn-outline-warning" onclick="fillCreds('driver.access@kwdc.test')">Driver</button>
                    <button type="button" class="btn btn-sm btn-outline-success" onclick="fillCreds('property.access@kwdc.test')">Property</button>
                    <button type="button" class="btn btn-sm btn-outline-purple" style="border-color:#9333ea; color:#9333ea;" onclick="fillCreds('equipment.access@kwdc.test')">Equipment</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillCreds('security.access@kwdc.test')">Security</button>
                </div>
            </div>

            <form action="/login" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold fs-7">Official Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-envelope text-muted"></i></span>
                        <input type="email" id="email" name="email" class="form-control" placeholder="name@company.np" required>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fw-bold fs-7 mb-0">Secure Password</label>
                        <a href="#" class="text-warning text-decoration-none fs-7 fw-bold">Forgot?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-key text-muted"></i></span>
                        <input type="password" id="password" name="password" class="form-control" value="KwdcNew2026!" required>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" name="remember" id="remember" checked>
                    <label class="form-check-label fs-7 text-muted" for="remember">
                        Remember session on this device
                    </label>
                </div>

                <button type="submit" class="btn btn-kwdc w-100 py-2 fs-6">
                    <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Authenticate & Enter
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <span class="text-muted fs-7">Don't have an enterprise account?</span>
                <a href="/register" class="text-warning fw-bold text-decoration-none ms-1 fs-7">Register here</a>
            </div>
        </div>
    </div>
</div>

<script>
function fillCreds(email) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = 'KwdcNew2026!';
}
</script>
{% endblock %}
