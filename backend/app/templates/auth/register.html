{% extends "base.html" %}

{% block title %}Register - KTM-WDC Commercial Logistics{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-6">
        <div class="glass-card shadow-lg p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="rounded-3 bg-primary text-white p-3 d-inline-flex mb-3 shadow-sm">
                    <i class="fa-solid fa-user-plus fs-4"></i>
                </div>
                <h3 class="fw-bold kwdc-serif text-slate-900">Create an Account</h3>
                <p class="text-muted fs-7">Join Nepal's integrated commercial logistics network</p>
            </div>

            <form action="/register" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold fs-7">Full Business / Contact Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Sita Logistics Pvt Ltd" required>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold fs-7">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="contact@company.np" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold fs-7">Nepali Mobile Phone</label>
                        <input type="tel" name="phone" class="form-control" placeholder="98XXXXXXXX" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold fs-7">Select Primary Ecosystem Role</label>
                    <select name="role" class="form-select" required>
                        <option value="client" selected>Enterprise Client / Shipper</option>
                        <option value="driver">Commercial Driver / Fleet Operator</option>
                        <option value="property_owner">Warehouse / Property Owner</option>
                        <option value="equipment_owner">Heavy Equipment & Machinery Owner</option>
                        <option value="security_agency">Licensed Security Agency</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold fs-7">Physical Office / Depot Address</label>
                    <input type="text" name="address" class="form-control" placeholder="e.g. Kalimati, Kathmandu">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold fs-7">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Min. 8 characters" required>
                </div>

                <button type="submit" class="btn btn-kwdc w-100 py-2 fs-6">
                    <i class="fa-solid fa-check me-2"></i> Complete Registration
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <span class="text-muted fs-7">Already registered?</span>
                <a href="/login" class="text-warning fw-bold text-decoration-none ms-1 fs-7">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
